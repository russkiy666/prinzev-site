<meta name="theme-color" content="#EEF3FB">
<title>Анкета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(h){h.className+=" js";var seen=false;try{seen=sessionStorage.getItem("ank-ld")==="1"}catch(e){}if(seen)h.className+=" no-ld";else h.className+=" ld-gate"})(document.documentElement)</script>
<style>
/* бело-синий стиль — один в один с лендингом SABIZ */
:root{
  --bg:#F3F6FB; --card:#FFFFFF; --ink:#0B1324; --muted:#5D6779; --line:#E3E8F1; --fill:#EEF2F8;
  --blue:#1D5CFF; --blue-ink:#FFFFFF; --blue-soft:#E8EFFF; --err:#D92D3A;
  --r:20px; --r-md:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 16px/1.5 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
main{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:40px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{position:relative;border-radius:var(--r);padding:22px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px -12px rgba(29,60,140,.18);animation:in .35s ease-out}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.card{-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* шапка */
.hero{display:flex;gap:14px;align-items:center}
.hero .gift{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(150deg,#4C86FF,#1D5CFF 60%,#1546C9);box-shadow:0 8px 20px rgba(29,92,255,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.hero .gift svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero h1{font-size:clamp(22px,6vw,28px);margin-top:4px}
.hero-lead{margin-top:12px;color:var(--muted);font-size:16px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border:0;border-radius:var(--r-md);font:600 17px/1.2 var(--font);letter-spacing:-.015em;text-decoration:none;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(29,92,255,.08) inset;transition:transform .12s,opacity .12s;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{color:#fff;background:linear-gradient(110deg,#1D5CFF,#3B82F6 50%,#1D5CFF);background-size:200% 100%;animation:sheen 5s linear infinite;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 8px 24px -8px rgba(29,92,255,.65)}
@keyframes sheen{from{background-position:0 0}to{background-position:-200% 0}}
.btn:active{transform:scale(.98);opacity:.85}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* анкета */
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background-color .3s}
.progress i.on,.progress i.cur{background:var(--blue)}
.step{border:0;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:12px;min-width:0}
.step.enter{animation:in .25s ease-out}
.step .label{text-transform:none;letter-spacing:0;font-weight:500}
.q{font-size:22px}
.sub{font-size:14px;color:var(--muted);margin-top:-6px}
.opts{display:grid;gap:8px}
.opt{position:relative;display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 14px;border-radius:var(--r-md);background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(29,92,255,.08) inset;cursor:pointer;font-size:17px;font-weight:500;line-height:1.25;user-select:none;-webkit-user-select:none}
.opt input,.emo input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.opt .rad{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #B7C0CF;display:grid;place-items:center}
.opt .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);transform:scale(0);transition:transform .15s}
.opt .rad.sq{border-radius:6px}
.opt .rad.sq::after{width:12px;height:12px;border-radius:3px}
.opt .rad::before{content:"";position:absolute;inset:0;border-radius:var(--r-md);border:2px solid transparent;pointer-events:none}
.opt input:checked + .rad{border-color:var(--blue)}
.opt input:checked + .rad::after{transform:scale(1)}
.opt input:checked + .rad::before{border-color:var(--blue);background:rgba(29,92,255,.06);box-shadow:0 0 16px -4px rgba(29,92,255,.6)}
.opt input:focus-visible + .rad::before{outline:2px solid var(--blue);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.emo{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(29,92,255,.08) inset;cursor:pointer;user-select:none;-webkit-user-select:none}
.emo .e{font-size:26px;line-height:1;filter:grayscale(1);opacity:.6;transition:filter .2s,opacity .2s,transform .2s}
.emo .l{font-size:12px;color:var(--muted)}
.emo .l::before{content:"";position:absolute;inset:0;border-radius:var(--r-md);border:2px solid transparent;pointer-events:none}
.emo input:checked + .e{filter:none;opacity:1;transform:scale(1.12)}
.emo input:checked ~ .l{color:var(--blue);font-weight:600}
.emo input:checked ~ .l::before{border-color:var(--blue);background:rgba(29,92,255,.06);box-shadow:0 0 16px -4px rgba(29,92,255,.6)}
.scale-hint{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.aw{padding:4px 0 6px}
.aw-val{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;margin-bottom:6px}
.aw-val b{font-size:54px;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--blue);font-variant-numeric:tabular-nums;transition:color .2s}
.aw-val b.idle{color:#B7C0CF}
.aw-val span{font-size:40px;line-height:1;transition:transform .2s}
.aw-range{-webkit-appearance:none;appearance:none;width:100%;height:40px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y;--p:44%}
.aw-range:focus{outline:none}
.aw-range::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:linear-gradient(90deg,#38BDF8,var(--blue) var(--p),#E1E7F2 var(--p))}
.aw-range::-moz-range-track{height:10px;border-radius:10px;background:#E1E7F2}
.aw-range::-moz-range-progress{height:10px;border-radius:10px;background:linear-gradient(90deg,#38BDF8,var(--blue))}
.aw-range::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:#fff;border:6px solid var(--blue);box-shadow:0 0 0 6px rgba(29,92,255,.16),0 6px 18px rgba(29,92,255,.45)}
.aw-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:6px solid var(--blue);box-shadow:0 0 0 6px rgba(29,92,255,.16),0 6px 18px rgba(29,92,255,.45)}
.aw-ends{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:2px}
.field textarea,.field input{width:100%;font:500 17px/1.4 var(--font);color:var(--ink);background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(29,92,255,.08) inset;border:2px solid transparent;border-radius:var(--r-md);padding:13px 14px;resize:none}
.field textarea{min-height:110px}
.field textarea:focus,.field input:focus{outline:none;border-color:var(--blue);background:#fff}
.err{color:var(--err);font-size:14px;min-height:1.3em;margin-top:10px}
.nav{display:flex;gap:8px}
.nav .btn.primary{flex:1}

/* финал */
.done{display:flex;flex-direction:column;gap:12px;margin-top:6px;text-align:center;align-items:center}
.done .ok{position:relative;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(150deg,#4C86FF,#1D5CFF 60%,#1546C9);box-shadow:0 12px 30px rgba(29,92,255,.4),inset 0 1px 0 rgba(255,255,255,.35);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.done .ok svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done .ok::after{content:"";position:absolute;inset:-8px;border-radius:28px;border:2px solid rgba(29,92,255,.35);animation:halo 1.8s ease-out infinite}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes halo{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.done h2{font-size:26px;margin-top:6px}
.done p{color:var(--muted);max-width:420px}
.done .btn{width:100%;margin-top:6px}
.done small{font-size:13px;color:var(--muted)}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}

footer{padding:8px 0 36px;text-align:center;font-size:13px;color:var(--muted)}

/* неон: бегущая синяя обводка */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.neon::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;z-index:3;
  background:conic-gradient(from var(--ang),transparent 0 60%,#1D5CFF 72%,#38BDF8 80%,transparent 90% 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:ring 5s linear infinite}
@keyframes ring{to{--ang:360deg}}
.neon{box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(29,92,255,.12),0 16px 40px -16px rgba(29,92,255,.45)}

/* фон: статичные облака (без фиксированных слоёв — лёгкий скролл) + звёзды на десктопе */
body{background:radial-gradient(60vmax 60vmax at 0 0,rgba(29,92,255,.22),transparent 60%),radial-gradient(60vmax 60vmax at 100% 30%,rgba(56,189,248,.18),transparent 60%),radial-gradient(60vmax 60vmax at 20% 100%,rgba(99,102,241,.14),transparent 60%),#EEF3FB;background-repeat:no-repeat;min-height:100vh;min-height:100dvh}
html{background:#EEF3FB}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* интро */
.loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:24px;text-align:center;background:radial-gradient(70vw 55vh at 50% 42%,rgba(29,92,255,.08),transparent 65%),#fff;transition:opacity .5s ease,visibility .5s ease}
html:not(.js) .loader,html.no-ld .loader{display:none!important}
html.ld-gate,html.ld-gate body{overflow:hidden}
.loader.done{opacity:0;visibility:hidden}
.ld-fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.loader > *:not(.ld-fx){position:relative;z-index:1}
.tt{display:block;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:34;height:clamp(90px,14vh,120px);width:auto;margin-bottom:10px}
.tt-track{stroke:#EEF2F8}
.tt-ink{stroke:var(--blue)}
.tt-d{stroke-dasharray:1 1.2;stroke-dashoffset:1.05;animation:draw 1.1s cubic-bezier(.55,.1,.35,1) .2s forwards}
.tt-d2{animation-duration:.4s;animation-delay:1.2s}
.tt-d3{animation-duration:.4s;animation-delay:1.4s}
@keyframes draw{to{stroke-dashoffset:0}}
.ld-words{display:block;width:min(520px,86vw);height:auto;overflow:visible}
.lw{font-family:var(--font);fill-opacity:0;stroke-linejoin:round}
.lw-name{font-size:96px;font-weight:700;letter-spacing:14px;fill:var(--ink);stroke:var(--ink);stroke-width:1.4;stroke-dasharray:480;stroke-dashoffset:480;animation:lwd 1.3s cubic-bezier(.55,.1,.35,1) 1.4s forwards,lwf .6s ease 2.5s forwards}
.lw-line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-dasharray:1 1.2;stroke-dashoffset:1.05;animation:draw .6s ease 3.5s forwards}
@keyframes lwd{to{stroke-dashoffset:0}}
@keyframes lwf{to{fill-opacity:1}}

/* телефон: максимально лёгкий режим */
@media (hover:none),(max-width:760px){
  #stars,.ld-fx{display:none}
  .neon::after{display:none}
  .neon{box-shadow:0 0 0 1.5px rgba(29,92,255,.45),0 8px 20px -10px rgba(29,92,255,.4)}
  .btn.primary{animation:none;background:#1D5CFF;box-shadow:0 6px 16px -8px rgba(29,92,255,.7)}
  .card{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:rgba(255,255,255,.88);box-shadow:0 6px 18px -12px rgba(29,60,140,.25);animation:none}
  .step.enter{animation-duration:.18s}
  .opt input:checked + .rad::before,.emo input:checked ~ .l::before{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tt-d,.lw-line{stroke-dashoffset:0}.lw{fill-opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="loader" id="ld" aria-hidden="true">
  <canvas class="ld-fx" id="ldfx" aria-hidden="true"></canvas>
  <svg class="tt" viewBox="60 110 435 900" aria-hidden="true"><g class="tt-track"><path d="M430 330C400 270 330 245 265 250C185 255 130 300 135 370C140 445 210 475 280 500C360 528 430 560 430 650C430 740 355 790 270 790C195 790 140 755 125 700"/><path d="M232 170C231 420 224 700 214 985"/><path d="M318 140C336 190 334 240 330 310C322 560 312 790 302 982"/></g><g class="tt-ink"><path class="tt-d tt-d1" pathLength="1" d="M430 330C400 270 330 245 265 250C185 255 130 300 135 370C140 445 210 475 280 500C360 528 430 560 430 650C430 740 355 790 270 790C195 790 140 755 125 700"/><path class="tt-d tt-d2" pathLength="1" d="M232 170C231 420 224 700 214 985"/><path class="tt-d tt-d3" pathLength="1" d="M318 140C336 190 334 240 330 310C322 560 312 790 302 982"/></g></svg>
</div>

<main>
  <div class="wrap stack">
    <section class="card" id="intro">
      <div class="hero">
        <div class="gift"><svg viewBox="0 0 24 24"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></div>
        <div>
          <span class="label" id="intro-label"></span>
          <h1 id="intro-title"></h1>
        </div>
      </div>
      <p class="hero-lead" id="intro-text"></p>
    </section>

    <section class="card neon" id="quiz">
      <div class="progress" aria-hidden="true" id="prog"></div>
      <div id="steps"></div>
      <div class="err" id="err" role="alert"></div>
      <div class="nav" id="nav">
        <button type="button" class="btn" id="back" hidden>Назад</button>
        <button type="button" class="btn primary" id="next">Дальше</button>
      </div>

      <div class="done" id="done" hidden>
        <div class="ok"><svg viewBox="0 0 24 24"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></div>
        <h2 id="done-title"></h2>
        <p id="done-text"></p>
        <a class="btn primary" id="gift-link" href="#" target="_blank" rel="noopener"><span id="gift-btn"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <small id="done-note"></small>
      </div>
    </section>
  </div>
</main>
<canvas id="confetti" aria-hidden="true"></canvas>


<script>
/* =====================================================================
   НАСТРОЙКИ — всё, что меняется под проект, только здесь
   ===================================================================== */
var CONFIG = {
  sheetUrl:  "https://script.google.com/macros/s/AKfycbzpm3MNtht3BNr-0SY2jniU1D3Bem31jn9yrZM7ZOQUcvg-lVdFwicz0d6p0ngPw6FF/exec",                               /* URL веб-приложения Google Apps Script (см. apps-script.gs). Пусто = демо, ответы никуда не уходят */
  giftUrl:   "https://t.me/+mNEOKWa03sxjMjEy",  /* пригласительная ссылка в закрытый канал */

  introLabel: "Анкета · 1 минута",
  introTitle: "Ответь на пару вопросов — и забери подарок",
  introText:  "6 коротких вопросов про тебя и финки. В конце откроется доступ в мой закрытый канал.",

  doneTitle: "Подарок твой 🎁",
  doneText:  "Спасибо, что ответил! Держи доступ в закрытый канал — там то, чего нет в открытом доступе.",
  doneBtn:   "Забрать доступ в канал",
  doneNote:  "Ссылка личная — не делись ей 🙌"
};

/* ВОПРОСЫ. Типы:
   choice — один вариант          multi — несколько вариантов
   slider — ползунок 1–10         emoji — шкала из 5 смайликов
   text   — свой ответ текстом (optional: true — можно пропустить)
   id — название колонки в таблице (лучше коротко, без пробелов) */
var QUESTIONS = [
  { id: "Возраст", type: "choice", title: "Сколько тебе лет?",
    options: ["14–17", "18–21", "22–25", "25+"] },

  { id: "Страна", type: "choice", title: "Откуда ты?",
    options: ["🇷🇺 РФ", "🌍 Не РФ"] },

  { id: "Сколько в финках", type: "choice", title: "Сколько ты уже интересуешься финками?",
    options: ["Только узнал", "1–3 месяца", "3–6 месяцев", "Больше полугода"] },

  { id: "Доход", type: "choice", title: "Какой у тебя текущий доход в месяц?",
    options: ["Пока нет дохода", "До 30 тыс. ₽", "30–100 тыс. ₽", "100–300 тыс. ₽", "Больше 300 тыс. ₽"] },

  { id: "Цель на 3 мес", type: "choice", title: "Какая цель по доходу на ближайшие 3 месяца?",
    options: ["50–100 тыс. ₽ в месяц", "100–200 тыс. ₽ в месяц", "200–300 тыс. ₽ в месяц", "300–500 тыс. ₽ в месяц", "500 тыс. ₽ и больше в месяц"] },

  { id: "Что непонятно", type: "multi", title: "Что тебе непонятно в финках?", sub: "Можно выбрать несколько",
    options: ["Не понимаю, где брать офферы", "Не понимаю, где брать лидов", "Не понимаю, как обрабатывать лидов", "Просто не понимаю, с чего начать"] }
];

/* ===== Telegram Mini App ===== */
var TG = (function(){
  var w = window.Telegram && window.Telegram.WebApp;
  if (!w || !w.initData) return null;
  try {
    w.ready(); w.expand();
    if (w.setHeaderColor) w.setHeaderColor("#EEF3FB");
    if (w.setBackgroundColor) w.setBackgroundColor("#EEF3FB");
    if (w.disableVerticalSwipes) w.disableVerticalSwipes();
  } catch(e) {}
  return w;
})();
function haptic(kind){
  try {
    if (!TG || !TG.HapticFeedback) return;
    if (kind === "ok") TG.HapticFeedback.notificationOccurred("success");
    else if (kind === "err") TG.HapticFeedback.notificationOccurred("error");
    else if (kind === "pick") TG.HapticFeedback.selectionChanged();
    else TG.HapticFeedback.impactOccurred("light");
  } catch(e) {}
}
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

/* тексты из настроек */
(function(){
  var map = { "intro-label":"introLabel", "intro-title":"introTitle", "intro-text":"introText",
              "done-title":"doneTitle", "done-text":"doneText", "gift-btn":"doneBtn", "done-note":"doneNote" };
  for (var k in map) $(k).textContent = CONFIG[map[k]] || "";
  $("gift-link").href = CONFIG.giftUrl;
})();

/* ===== Звук нажатий: синтезированный «мягкий клик клавиатуры», без файлов ===== */
var sfx = (function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, out = null, last = 0, NB = null, enabled = true;
  /* звук кнопки «Звук» убран из шапки — тапы всегда включены */
  function build(){
    ctx = new AC(); out = ctx.createGain(); out.gain.value = .9; NB = null;
    var comp = ctx.createDynamicsCompressor(); out.connect(comp); comp.connect(ctx.destination);
  }
  function ready(){
    if (!ctx || ctx.state === "closed") build();
    /* iPhone переводит звук в «interrupted», когда играет видео со звуком — будим его снова */
    if (ctx.state !== "running") { try { ctx.resume(); } catch(e) {} }
  }
  /* разблокировка звука на iPhone: в момент касания будим контекст и проигрываем тишину */
  function unlock(){
    if (!AC) return;
    try {
      ready();
      var b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource();
      src.buffer = b; src.connect(ctx.destination); src.start(0);
    } catch(e) {}
  }
  document.addEventListener("touchstart", unlock, { passive: true, capture: true });
  document.addEventListener("pointerdown", unlock, { passive: true, capture: true });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && ctx && ctx.state !== "running") { try { ctx.resume(); } catch(e) {} } });
  function noise(){
    if (NB) return NB;
    NB = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    var d = NB.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    return NB;
  }
  function tone(f, dur, vol, delay){
    var t = ctx.currentTime + (delay||0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.006); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.02);
  }
  function key(o){
    o = o || {};
    var t = ctx.currentTime + (o.d||0), v = (o.v||1)*.85*(.9+Math.random()*.2), p = (o.p||1)*(.96+Math.random()*.08), nb = noise();
    var n = ctx.createBufferSource(); n.buffer = nb;
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 620*p; bp.Q.value = 1.1;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1900*p;
    var g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.42*v, t+.0012); g.gain.exponentialRampToValueAtTime(.0008, t+.048);
    n.connect(bp); bp.connect(lp); lp.connect(g); g.connect(out); n.start(t, Math.random()*.8); n.stop(t+.06);
    var f = (1040+Math.random()*120)*p, parts = [[f,.11,.026],[f*2.62,.03,.014]];
    for (var k = 0; k < parts.length; k++) {
      var q = parts[k], o2 = ctx.createOscillator(); o2.type = "sine";
      o2.frequency.setValueAtTime(q[0], t); o2.frequency.exponentialRampToValueAtTime(q[0]*.9, t+q[2]);
      var g2 = ctx.createGain(); g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(q[1]*v, t+.001); g2.gain.exponentialRampToValueAtTime(.0005, t+q[2]);
      o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t+q[2]+.01);
    }
    var o3 = ctx.createOscillator(); o3.type = "sine";
    o3.frequency.setValueAtTime(165*p, t); o3.frequency.exponentialRampToValueAtTime(105*p, t+.045);
    var g3 = ctx.createGain(); g3.gain.setValueAtTime(.2*v, t); g3.gain.exponentialRampToValueAtTime(.0008, t+.055);
    o3.connect(g3); g3.connect(out); o3.start(t); o3.stop(t+.06);
  }
  var S = {
    tap:   function(){ key(); },
    pick:  function(){ key({p:1.12, v:.9}); },
    open:  function(){ key({p:.8, v:1.1}); },
    close: function(){ key({p:.88, v:.85}); },
    next:  function(){ key({p:1.05}); key({p:1.25, v:.5, d:.06}); },
    err:   function(){ key({p:.7, v:.9}); key({p:.62, v:.7, d:.09}); },
    welcome: function(){ key({p:.8, v:1.1}); tone(523,.9,.035,.05); tone(784,1,.03,.14); tone(1046,1.2,.025,.24); tone(1568,1.4,.015,.34); },
    win:   function(){ key({p:1.05}); tone(659,.6,.04,.08); tone(988,.8,.035,.16); tone(1319,.9,.025,.24); }
  };
  /* ползунок: мягкая «стеклянная» нота пентатоники, чем выше значение — тем выше и ярче */
  var PENT = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319];
  function slide(x){
    if (!AC || !enabled || hold) return;
    var now = Date.now(); if (now - last < 45) return; last = now;
    try {
      ready(); var f = PENT[Math.max(0, Math.min(9, x - 1))];
      tone(f, .45, .05); tone(f*2, .22, .014, .005);
      if (x >= 9) tone(f*3, .3, .01, .03);
    } catch(e) {}
  }
  function play(n, force){
    if (!AC || (!enabled && !force)) return;
    var now = Date.now(); if (now - last < 40) return; last = now;
    try { ready(); S[n](); } catch(e) {}
  }
  function set(v){ enabled = v; try { localStorage.setItem("sab-snd", v ? "on" : "off"); } catch(e) {} }
  var hold = false;
  /* пока Reels играет со звуком — тапы молчат, но звук не «усыпляем», чтобы он сразу вернулся */
  function pause(on){ hold = on; }
  return { play: function(n, f){
      haptic(n === "win" ? "ok" : n === "err" ? "err" : n === "pick" ? "pick" : "tap");
      if (!hold) play(n, f);
    }, set: set, slide: slide, on: function(){ return enabled; }, ok: !!AC, pause: pause };
})();



/* ===== Интро: знак рисуется → название → плавно уходит само ===== */
(function(){
  var root = document.documentElement, ld = $("ld");
  if (!ld || /\bno-ld\b/.test(root.className)) return;
  var finished = false;
  function finish(){
    if (finished) return; finished = true;
    root.className = root.className.replace(/\s*ld-gate/g, "");
    try { sessionStorage.setItem("ank-ld", "1"); } catch(e) {}
    sfx.play("welcome");
    ld.className += " done";
    setTimeout(function(){ if (ld.parentNode) ld.parentNode.removeChild(ld); }, 800);
  }
  ld.addEventListener("click", finish);
  setTimeout(finish, 2600);
})();

/* ===== Анкета ===== */
(function(){
  var box = $("steps"), prog = $("prog"), err = $("err"), back = $("back"), next = $("next");
  var N = QUESTIONS.length, cur = 0, html = "", bar = "";

  /* собираем шаги из списка вопросов */
  QUESTIONS.forEach(function(q, i){
    var nm = "q" + i, body = "";
    if (q.type === "choice" || q.type === "multi") {
      var multi = q.type === "multi";
      body = '<div class="opts">' + q.options.map(function(o){
        return '<label class="opt"><input type="' + (multi ? "checkbox" : "radio") + '" name="' + nm + '" value="' + esc(o) + '"><span class="rad' + (multi ? " sq" : "") + '"></span>' + esc(o) + '</label>';
      }).join("") + "</div>";
    } else if (q.type === "slider") {
      body = '<div class="aw"><div class="aw-val"><b class="idle">?</b><span>❄️</span></div>' +
        '<input class="aw-range" type="range" name="' + nm + '" min="1" max="10" step="1" value="5" aria-label="' + esc(q.title) + '">' +
        '<div class="aw-ends"><span>' + esc(q.left || "1") + '</span><span>' + esc(q.right || "10") + "</span></div></div>";
    } else if (q.type === "emoji") {
      var E = ["😴", "🙂", "😏", "🔥", "🚀"];
      body = '<div class="scale">' + E.map(function(e, k){
        return '<label class="emo"><input type="radio" name="' + nm + '" value="' + (k + 1) + '"><span class="e">' + e + '</span><span class="l">' + (k + 1) + "</span></label>";
      }).join("") + '</div><div class="scale-hint"><span>' + esc(q.left || "") + "</span><span>" + esc(q.right || "") + "</span></div>";
    } else {
      body = '<div class="field"><textarea name="' + nm + '" maxlength="600" placeholder="' + esc(q.placeholder || "") + '"></textarea></div>';
    }
    html += '<fieldset class="step" hidden><span class="label">Вопрос ' + (i + 1) + " из " + N + '</span><h3 class="q">' + esc(q.title) + "</h3>" +
      (q.sub ? '<p class="sub">' + esc(q.sub) + "</p>" : "") + body + "</fieldset>";
    bar += "<i></i>";
  });
  box.innerHTML = html; prog.innerHTML = bar;
  var steps = box.querySelectorAll(".step");

  /* ползунки */
  Array.prototype.forEach.call(box.querySelectorAll(".aw"), function(aw){
    var r = aw.querySelector("input"), b = aw.querySelector("b"), s = aw.querySelector(".aw-val span");
    function upd(touch){
      var x = +r.value; r.style.setProperty("--p", ((x - 1) / 9 * 100) + "%");
      if (!touch) return;
      r.dataset.touched = "1"; b.className = ""; b.textContent = x;
      s.textContent = x <= 3 ? "❄️" : x <= 7 ? "⚡️" : "🔥";
      s.style.transform = "scale(" + (1 + x / 30) + ")";
      sfx.slide(x); haptic("pick"); err.textContent = "";
    }
    r.addEventListener("input", function(){ upd(true); });
    upd(false);
  });

  /* звук и сброс ошибки на выбор */
  box.addEventListener("change", function(e){
    if (e.target.type === "radio" || e.target.type === "checkbox") { err.textContent = ""; sfx.play("pick"); }
  });

  function value(i){
    var q = QUESTIONS[i], nm = "q" + i;
    if (q.type === "multi") return Array.prototype.map.call(box.querySelectorAll('input[name="' + nm + '"]:checked'), function(x){ return x.value; }).join(", ");
    if (q.type === "slider") { var r = box.querySelector('input[name="' + nm + '"]'); return r.dataset.touched ? r.value : ""; }
    if (q.type === "text") return box.querySelector('textarea[name="' + nm + '"]').value.trim();
    var c = box.querySelector('input[name="' + nm + '"]:checked'); return c ? c.value : "";
  }
  function check(i){
    var q = QUESTIONS[i]; if (value(i) || q.optional) return "";
    return q.type === "slider" ? "Передвинь ползунок, чтобы продолжить"
         : q.type === "emoji" ? "Выбери смайлик, чтобы продолжить"
         : q.type === "text" ? "Напиши пару слов, чтобы продолжить"
         : "Выбери вариант, чтобы продолжить";
  }
  function show(i, animate){
    Array.prototype.forEach.call(steps, function(s){ s.hidden = true; s.className = "step"; });
    var st = steps[i]; st.hidden = false;
    if (animate) { void st.offsetWidth; st.className = "step enter"; }
    Array.prototype.forEach.call(prog.children, function(b, k){ b.className = k < i ? "on" : (k === i ? "cur" : ""); });
    back.hidden = i === 0;
    next.textContent = i === N - 1 ? "Получить подарок 🎁" : "Дальше";
    err.textContent = "";
  }

  /* отправка в Google таблицу */
  function send(){
    var u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
    var answers = {}; QUESTIONS.forEach(function(q, i){ answers[q.id] = value(i); });
    var body = JSON.stringify({
      date: new Date().toLocaleString("ru-RU", { timeZone: "Europe/Moscow" }),
      tg_id: u ? String(u.id) : "",
      username: u && u.username ? "@" + u.username : "",
      name: u ? [u.first_name, u.last_name].filter(Boolean).join(" ") : "",
      source: (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || (/[?&]src=([^&#]+)/.exec(location.search) || [])[1] || "",
      answers: answers
    });
    if (!CONFIG.sheetUrl) { console.log("Демо-режим, ответы:", body); return; }
    var ok = false;
    try { ok = navigator.sendBeacon && navigator.sendBeacon(CONFIG.sheetUrl, new Blob([body], { type: "text/plain;charset=utf-8" })); } catch(x) {}
    if (!ok && window.fetch) fetch(CONFIG.sheetUrl, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body });
  }

  function openGift(){
    var url = CONFIG.giftUrl;
    if (!TG) { if (!window.open(url, "_blank")) location.href = url; return; }
    var moved = false; function mark(){ moved = true; }
    document.addEventListener("visibilitychange", mark); window.addEventListener("blur", mark);
    try { TG.openTelegramLink(url); } catch(x) {}
    setTimeout(function(){
      document.removeEventListener("visibilitychange", mark); window.removeEventListener("blur", mark);
      if (!moved) { try { TG.openLink(url); } catch(y) { location.href = url; } }
    }, 1000);
  }

  function finish(){
    Array.prototype.forEach.call(steps, function(s){ s.hidden = true; });
    $("nav").hidden = true; err.textContent = "";
    Array.prototype.forEach.call(prog.children, function(b){ b.className = "on"; });
    $("done").hidden = false;
    sfx.play("win"); confetti();
    $("quiz").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  back.addEventListener("click", function(){ if (cur > 0) { cur--; show(cur, true); sfx.play("close"); } });
  next.addEventListener("click", function(){
    var e = check(cur);
    if (e) { err.textContent = e; sfx.play("err"); return; }
    if (cur < N - 1) { cur++; show(cur, true); sfx.play("next"); return; }
    send(); finish();
  });
  $("gift-link").addEventListener("click", function(e){ e.preventDefault(); sfx.play("tap"); openGift(); });

  show(0, false);
})();

/* ===== Конфетти в бело-синих тонах ===== */
function confetti(){
  var c = $("confetti"); if (!c || !c.getContext) return;
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch(e) {}
  var x = c.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 1.5), W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  var C = ["#1D5CFF", "#38BDF8", "#6366F1", "#8DB3FF", "#BFD3FF"], P = [];
  var NP = (matchMedia("(hover: none)").matches ? 45 : 110); for (var i = 0; i < NP; i++) P.push({ x: W / 2 + (Math.random() - .5) * 60, y: H * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 4,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, c: C[(Math.random() * C.length) | 0] });
  var t0 = performance.now();
  (function f(t){
    var k = (t - t0) / 1000; x.clearRect(0, 0, W, H);
    P.forEach(function(p){ p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.globalAlpha = Math.max(0, 1 - k / 2.6); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (k < 2.6) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

/* ===== Синие звёзды-точки на фоне: на телефоне рисуются один раз ===== */
(function(){
  var c = document.getElementById("stars"); if (!c || !c.getContext) return;
  try { if (matchMedia("(hover: none)").matches || innerWidth < 760) { c.parentNode.removeChild(c); return; } } catch(e) {}
  var x = c.getContext("2d"), W, H, st = [], timer = 0, still = false;
  try { still = matchMedia("(prefers-reduced-motion: reduce)").matches || matchMedia("(hover: none)").matches; } catch(e) {}
  function size(){
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = c.clientWidth; H = c.clientHeight; c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.min(W < 760 ? 50 : 120, Math.round(W * H / 10000)); st = [];
    for (var i = 0; i < n; i++) st.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .6, p: Math.random() * 6.28, s: Math.random() * .05 + .02, c: Math.random() < .5 ? "29,92,255" : "56,189,248" });
  }
  function draw(step){
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < st.length; i++) { var q = st[i]; if (step) q.p += q.s;
      x.globalAlpha = still ? .35 : .15 + .35 * Math.abs(Math.sin(q.p)); x.fillStyle = "rgb(" + q.c + ")";
      x.beginPath(); x.arc(q.x, q.y, q.r, 0, 6.283); x.fill(); }
    x.globalAlpha = 1;
  }
  function loop(){ clearTimeout(timer); if (document.hidden || still) return; draw(true); timer = setTimeout(loop, 60); }
  size(); draw(false); loop();
  document.addEventListener("visibilitychange", loop);
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(function(){ size(); draw(false); loop(); }, 200); });
})();

/* ===== Интро: синие точки плывут и соединяются линиями ===== */
(function(){
  var c = document.getElementById("ldfx"), ld = document.getElementById("ld");
  if (!c || !c.getContext || !ld || /\bno-ld\b/.test(document.documentElement.className)) return;
  try { if (matchMedia("(hover: none)").matches || innerWidth < 760) { c.parentNode.removeChild(c); return; } } catch(e) {}
  var x = c.getContext("2d"), W, H, P = [], run = true, mob = false, raf = 0, last = 0;
  var COLORS = ["29,92,255", "56,189,248", "99,102,241"], SPR = [];
  for (var ci = 0; ci < COLORS.length; ci++) {
    var sc = document.createElement("canvas"); sc.width = sc.height = 32;
    var g = sc.getContext("2d"), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, "rgba(" + COLORS[ci] + ",1)"); gr.addColorStop(.2, "rgba(" + COLORS[ci] + ",.9)");
    gr.addColorStop(.45, "rgba(" + COLORS[ci] + ",.2)"); gr.addColorStop(1, "rgba(" + COLORS[ci] + ",0)");
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32); SPR.push(sc);
  }
  function size(){
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = c.clientWidth; H = c.clientHeight; mob = W < 760;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = mob ? 30 : 60; P = [];
    for (var i = 0; i < n; i++) { var an = Math.random() * 6.283, sp = .15 + Math.random() * .3;
      P.push({ x: Math.random() * W, y: Math.random() * H, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, s: 6 + Math.random() * 9, ph: Math.random() * 6.283, tw: .015 + Math.random() * .02, k: (Math.random() * 3) | 0 }); }
  }
  function frame(t){
    if (!run) return; raf = requestAnimationFrame(frame);
    var dt = last ? Math.min(3, (t - last) / 16.7) : 1; last = t;
    x.clearRect(0, 0, W, H);
    var L = mob ? 85 : 120, L2 = L * L, i, j, p, q;
    for (i = 0; i < P.length; i++) { p = P[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.ph += p.tw * dt;
      if (p.x < -12) p.x = W + 12; else if (p.x > W + 12) p.x = -12; if (p.y < -12) p.y = H + 12; else if (p.y > H + 12) p.y = -12; }
    var near = new Path2D(), far = new Path2D();
    for (i = 0; i < P.length; i++) for (j = i + 1; j < P.length; j++) { p = P[i]; q = P[j];
      var dx = p.x - q.x; if (dx > L || dx < -L) continue; var dy = p.y - q.y; if (dy > L || dy < -L) continue;
      var d2 = dx * dx + dy * dy; if (d2 > L2) continue; var path = d2 < L2 * .35 ? near : far; path.moveTo(p.x, p.y); path.lineTo(q.x, q.y); }
    x.lineWidth = .7; x.strokeStyle = "rgba(29,92,255,.08)"; x.stroke(far); x.strokeStyle = "rgba(29,92,255,.18)"; x.stroke(near);
    for (i = 0; i < P.length; i++) { p = P[i]; x.globalAlpha = .45 + .55 * Math.abs(Math.sin(p.ph)); x.drawImage(SPR[p.k], p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
    x.globalAlpha = 1;
  }
  size(); raf = requestAnimationFrame(frame);
  window.addEventListener("resize", size);
  document.addEventListener("visibilitychange", function(){ if (document.hidden) { cancelAnimationFrame(raf); last = 0; } else if (run) raf = requestAnimationFrame(frame); });
  new MutationObserver(function(){ if (/\bdone\b/.test(ld.className)) { run = false; cancelAnimationFrame(raf); c.width = c.height = 0; } }).observe(ld, { attributes: true, attributeFilter: ["class"] });
})();
