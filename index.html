<title>Кабинет «Продюсер с нуля»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: кабинет ученика — левая навигация + рабочая область; путь как вертикальная трасса этапов */
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --ink:#0D1A33; --muted:#5A6784; --line:#E1E8F4;
  --blue:#1F5EFF; --blue-deep:#0B3CC2; --blue-soft:#E9F0FF; --on-blue:#FFFFFF;
  --ok:#0F9A63; --ok-soft:#E3F6EE; --warn:#C27A00; --warn-soft:#FFF3DA;
  --bad:#D63C31; --bad-soft:#FDE9E7; --idle:#7A86A1; --idle-soft:#EEF1F7;
  --shadow:0 1px 2px rgba(13,26,51,.05),0 8px 24px rgba(31,94,255,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080E1C; --surface:#0F182C; --ink:#E7EDFB; --muted:#93A0BD; --line:#1E2A45;
  --blue:#5C8DFF; --blue-deep:#8FB0FF; --blue-soft:#14234A; --on-blue:#08122A;
  --ok:#3CCB8F; --ok-soft:#0F2B22; --warn:#F2B544; --warn-soft:#2E2410;
  --bad:#FF7A70; --bad-soft:#341716; --idle:#8692AD; --idle-soft:#17213A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080E1C; --surface:#0F182C; --ink:#E7EDFB; --muted:#93A0BD; --line:#1E2A45;
  --blue:#5C8DFF; --blue-deep:#8FB0FF; --blue-soft:#14234A; --on-blue:#08122A;
  --ok:#3CCB8F; --ok-soft:#0F2B22; --warn:#F2B544; --warn-soft:#2E2410;
  --bad:#FF7A70; --bad-soft:#341716; --idle:#8692AD; --idle-soft:#17213A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(22px,3vw,30px);line-height:1.2}
h2{font-size:18px}
h3{font-size:15px;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.brand b{font-family:var(--f-display);font-size:14px;font-weight:600;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--blue-soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;padding:14px;border-radius:12px;background:var(--blue-soft);display:grid;gap:8px}
.side-foot .bar{height:6px}

.main{padding-block:28px 64px;padding-left:max(16px,clamp(16px,3vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,40px));min-width:0;max-width:1180px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.view{display:grid;gap:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid{display:grid;gap:20px}
.g-hero{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}

.bar{height:10px;border-radius:99px;background:var(--idle-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:inherit;transition:width .5s}

.hero{background:var(--blue);color:var(--on-blue);border:none;position:relative;overflow:hidden;display:grid;gap:18px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:36px solid rgba(255,255,255,.08)}
.hero .eyebrow{color:inherit;opacity:.75}
.hero .big{font-family:var(--f-display);font-size:clamp(40px,6vw,56px);font-weight:700;line-height:1}
.hero .bar{background:rgba(255,255,255,.22);height:8px}
.hero .bar i{background:var(--on-blue)}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;position:relative;z-index:1}
.hero-stats div{display:grid}
.hero-stats b{font-family:var(--f-mono);font-size:18px}
.hero-stats span{font-size:12px;opacity:.8}

.next{display:grid;gap:12px;align-content:start}
.next .kind{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--blue-deep);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--blue);color:var(--on-blue);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--blue-deep)}
.btn.ghost{background:var(--blue-soft);color:var(--blue-deep)}
.btn.ghost:hover{background:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* path */
.track{display:grid;gap:0;position:relative}
.stage{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;position:relative;padding-bottom:18px}
.stage:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.stage.done:not(:last-child)::before{background:var(--blue)}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;border:2px solid var(--line);background:var(--surface);color:var(--muted);z-index:1}
.stage.done .node{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.stage.current .node{border-color:var(--blue);color:var(--blue-deep);box-shadow:0 0 0 5px var(--blue-soft)}
.node svg{width:18px;height:18px}
.stage-body{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.stage.current .stage-body{border-color:var(--blue);box-shadow:var(--shadow)}
.stage.locked .stage-body{background:transparent;border-style:dashed}
.stage-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.stage-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stage .bar{height:6px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-accepted{background:var(--ok-soft);color:var(--ok)}
.s-review{background:var(--warn-soft);color:var(--warn)}
.s-rework{background:var(--bad-soft);color:var(--bad)}
.s-todo{background:var(--blue-soft);color:var(--blue-deep)}
.s-locked{background:var(--idle-soft);color:var(--idle)}

.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:140px;padding-top:8px}
.chart div{display:grid;gap:6px;justify-items:center;height:100%;align-content:end}
.chart i{width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--blue-soft)}
.chart div:last-child i{background:var(--blue)}
.chart span{font-size:11px;color:var(--muted)}
.chart em{font-style:normal;font-size:11px;font-family:var(--f-mono);color:var(--muted)}

.msg{display:grid;gap:6px;padding:14px;border-radius:12px;background:var(--bg)}
.msg-who{display:flex;gap:10px;align-items:center;font-size:13px}
.ava{width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue-deep);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.ava.me{background:var(--blue);color:var(--on-blue)}

/* lessons */
.lessons-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.player{position:sticky;top:20px;display:grid;gap:16px}
.screen{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:linear-gradient(135deg,var(--blue-deep),var(--blue));display:grid;place-items:center;position:relative;color:#fff;overflow:hidden}
.screen button{width:64px;height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.95);color:#0B3CC2;display:grid;place-items:center}
.screen button svg{width:24px;height:24px;margin-left:3px}
.screen .tc{position:absolute;left:14px;bottom:12px;font-family:var(--f-mono);font-size:12px;opacity:.85}
.screen .stg{position:absolute;left:14px;top:12px;font-size:12px;opacity:.85}
.mods{display:grid;gap:12px}
.mod{padding:0;overflow:hidden}
.mod summary{list-style:none;padding:16px 18px;display:flex;gap:12px;align-items:center;cursor:pointer}
.mod summary::-webkit-details-marker{display:none}
.mod summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.mod[open] summary .chev{transform:rotate(180deg)}
.mod-n{font-family:var(--f-mono);font-size:12px;color:var(--blue-deep);background:var(--blue-soft);border-radius:8px;padding:4px 8px}
.mod.is-locked .mod-n{color:var(--idle);background:var(--idle-soft)}
.lrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border:none;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.lrow:hover:not(:disabled){background:var(--blue-soft)}
.lrow[aria-current="true"]{background:var(--blue-soft)}
.lrow:disabled{cursor:not-allowed;opacity:.55}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:12px;height:12px}
.lrow small{display:block;color:var(--muted);font-size:12px}
.mats{display:grid;gap:8px}
.mat{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.mat svg{width:16px;height:16px;color:var(--blue);flex:none}

/* tasks */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:500;opacity:.6;margin-left:4px}
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:16px 18px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative}
.trow:hover:not(:disabled){border-color:var(--blue)}
.trow:disabled{cursor:not-allowed;opacity:.6}
.trow .stg{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:56px}
.trow .dl{font-size:13px;color:var(--muted);white-space:nowrap}
.trow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.d-body{padding:20px 24px;overflow:auto;display:grid;gap:18px;align-content:start;flex:1}
.d-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.x{border:none;background:var(--idle-soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.criteria{margin:0;padding-left:18px;display:grid;gap:4px}
textarea,select,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
textarea{min-height:120px;resize:vertical}
textarea:focus,select:focus,input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600}
.thread{display:grid;gap:10px}

/* feedback */
.req{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.req:first-child{border-top:none;padding-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg input{accent-color:var(--blue)}
.seg label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue-deep)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;z-index:60;box-shadow:var(--shadow)}

@media (max-width:980px){.g-hero,.g-2,.lessons-layout{grid-template-columns:minmax(0,1fr)}.player{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand div,.side-foot{display:none}
  .brand{padding:0}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:8px 10px;font-size:13px;white-space:nowrap}
  .nav a svg{display:none}
}
@media (max-width:560px){
  .trow{grid-template-columns:minmax(0,1fr) auto}
  .trow .stg{grid-column:1/-1;width:auto}
  .trow .dl{grid-column:1}
  .hero-stats{gap:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">П</div><div><b>Продюсер с нуля</b><span>Поток №4 · пример</span></div></div>
    <nav class="nav" id="nav">

</div>
<div id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>'
};
const STATUS = {accepted:'Принято', review:'На проверке', rework:'На доработке', todo:'Нужно сдать', locked:'Закрыто'};

// ---- Пример курса: замените на свои уроки и задания ----
const SEED = {
  student:'Анна', curator:'Максим, куратор',
  stages:[
    {title:'Фундамент', goal:'Понять профессию и выбрать модель работы',
     lessons:[['l1','Кто такой продюсер и на чём он зарабатывает',18,'Видео'],['l2','Модели работы: процент, фикс, партнёрство',22,'Видео'],['l3','Карта запуска от идеи до продаж',15,'Схема']],
     tasks:[['t1','Опиши свою модель работы','Выбери модель (процент, фикс или партнёрство) и посчитай, сколько ты хочешь зарабатывать в первые 3 месяца.','12 окт',['Выбрана одна модель и объяснено почему','Есть расчёт дохода на 3 месяца']]]},
    {title:'Поиск эксперта', goal:'Найти и оценить экспертов для первого запуска',
     lessons:[['l4','Где искать экспертов: 6 каналов',20,'Видео'],['l5','Как оценить блог: охваты, ER, доверие',26,'Видео'],['l6','Первое сообщение эксперту',14,'Практикум']],
     tasks:[['t2','Таблица из 10 экспертов','Найди 10 экспертов и оцени каждого по таблице из урока: ниша, охваты сторис, ER, наличие продукта.','19 окт',['10 экспертов в таблице','Заполнены все столбцы','Выделены топ-3 кандидата']],

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ALL_TASKS = SEED.stages.flatMap((st,i)=>st.tasks.map(t=>({id:t[0],title:t[1],desc:t[2],deadline:t[3],criteria:t[4],stage:i})));
const ALL_LESSONS = SEED.stages.flatMap((st,i)=>st.lessons.map(l=>({id:l[0],title:l[1],min:l[2],kind:l[3],stage:i})));
const taskState = id => S.tasks[id] || (S.tasks[id] = {status:'todo',thread:[]});
function stageLocked(i){ return i>0 && SEED.stages[i-1].tasks.some(t=>taskState(t[0]).status!=='accepted'); }
function taskStatus(t){ return stageLocked(t.stage) ? 'locked' : taskState(t.id).status; }
function stageInfo(i){
  const st = SEED.stages[i];
  const ld = st.lessons.filter(l=>S.lessons[l[0]]).length;
  const ta = st.tasks.filter(t=>taskState(t[0]).status==='accepted').length;
  const locked = stageLocked(i);
  const done = !locked && ld===st.lessons.length && ta===st.tasks.length;
  return {ld,ta,locked,done,pct:Math.round((ld+ta)/(st.lessons.length+st.tasks.length)*100),
    min:st.lessons.reduce((a,l)=>a+l[2],0)};
}
function totals(){
  const ld = ALL_LESSONS.filter(l=>S.lessons[l.id]).length;
  const ta = ALL_TASKS.filter(t=>taskState(t.id).status==='accepted').length;
  const rv = ALL_TASKS.filter(t=>taskStatus(t)==='review').length;
  const rw = ALL_TASKS.filter(t=>taskStatus(t)==='rework').length;
  let cur = SEED.stages.findIndex((_,i)=>!stageInfo(i).done); if(cur<0) cur=SEED.stages.length-1;
  return {ld,ta,rv,rw,cur,pct:Math.round((ld+ta)/(ALL_LESSONS.length+ALL_TASKS.length)*100)};
}
function pill(s){ return `<span class="pill s-${s}">${STATUS[s]}</span>`; }

function greet(){ const h=new Date().getHours(); return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'; }

let FILTER='all';

  const counts = {all:ALL_TASKS.length};
  ALL_TASKS.forEach(t=>{const s=taskStatus(t);counts[s]=(counts[s]||0)+1});
  const list = ALL_TASKS.filter(t=>FILTER==='all'||taskStatus(t)===FILTER);
  const chips = [['all','Все'],['todo','Нужно сдать'],['rework','На доработке'],['review','На проверке'],['accepted','Принято'],['locked','Закрыто']];
  return `
  <div class="head"><div><div class="eyebrow">Куратор проверяет за 48 часов</div><h1>Задания</h1></div></div>
  <div class="chips">${chips.map(c=>`<button class="chip" data-filter="${c[0]}" aria-pressed="${FILTER===c[0]}">${c[1]}<b>${counts[c[0]]||0}</b></button>`).join('')}</div>
  <div class="tlist">${list.length?list.map(t=>{const s=taskStatus(t);const ts=taskState(t.id);
    return `<button class="trow" data-go="task" data-id="${t.id}" ${s==='locked'?'disabled':''}>

  document.getElementById('main').innerHTML = `<div class="view">${views[key]()}</div>`;
  PRE='';
  document.querySelectorAll('#nav a').forEach(a=>{ if(a.dataset.v===key) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const T = totals();
  document.getElementById('sideBar').style.width = T.pct+'%';
  document.getElementById('sidePct').textContent = T.pct+'% · этап '+(T.cur+1)+' из '+SEED.stages.length;
  const b = document.getElementById('navBadge'); const need = T.rw; b.hidden=!need; b.textContent=need;
}
window.addEventListener('hashchange',()=>{closeDrawer();render();window.scrollTo(0,0)});

document.addEventListener('click',e=>{
  const el = e.target.closest('[data-go],[data-lesson],[data-filter],[data-close],#markLesson,#sendTask,[data-pre]');
  if(!el) return;
  if(el.dataset.pre){ PRE=el.dataset.pre; closeDrawer(); if(location.hash==='#feedback'){e.preventDefault();render();} return; }
  if(el.hasAttribute('data-close')) return closeDrawer();
  if(el.dataset.go==='task') return openTask(el.dataset.id);
  if(el.dataset.go==='lesson'){ S.current=el.dataset.id; save(); location.hash='#lessons'; render(); return; }
  if(el.dataset.lesson){ S.current=el.dataset.lesson; save(); render(); return; }
  if(el.dataset.filter){ FILTER=el.dataset.filter; render(); return; }
  if(el.id==='markLesson'){ const id=el.dataset.id; if(S.lessons[id]) delete S.lessons[id]; else { S.lessons[id]=1; toast('Урок отмечен пройденным'); }
    const idx=ALL_LESSONS.findIndex(l=>l.id===id); const nx=ALL_LESSONS[idx+1];
    if(S.lessons[id] && nx && !stageLocked(nx.stage)) S.current=nx.id; save(); render(); return; }
  if(el.id==='sendTask'){ const ta=document.getElementById('ans'); const v=ta.value.trim();
    if(!v){ ta.focus(); ta.placeholder='Напиши ответ или вставь ссылку, чтобы отправить'; return; }
    const ts=taskState(el.dataset.id); ts.status='review'; ts.thread.push(['me',v,today()]); save(); closeDrawer(); render(); toast('Задание отправлено на проверку'); }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='reqForm') return; e.preventDefault();
  const text=document.getElementById('rqText').value.trim(); if(!text) return;
  S.requests.unshift({id:Date.now(),type:e.target.querySelector('input[name=type]:checked').value,task:document.getElementById('rqTask').value,text,date:today(),status:'waiting'});
  save(); render(); toast('Запрос отправлен куратору');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
render();
</script>
